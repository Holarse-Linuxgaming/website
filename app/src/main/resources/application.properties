spring.profiles.active=@spring.profiles.active@
mail.host=mail
mail.port=1025
spring.servlet.multipart.max-file-size=5242880
spring.servlet.multipart.max-request-size=5242880
spring.mvc.static-path-pattern=/assets/**
spring.web.resources.static-locations=classpath:/assets/

# logging ALL < TRACE < DEBUG < INFO < WARN < ERROR < FATAL < OFF
logging.level.root=info
logging.level.org.springframework.web=info
logging.level.org.springframework.security=info
logging.level.org.hibernate=info
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace
# application specific
logging.level.de.holarse=debug

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.show-sql=false
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.open-in-view=false

# flyway db migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# queue
amq.brokerUrl=tcp://${ARTEMIS_HOST}:61616
amq.username=${ARTEMIS_USER}
amq.password=${ARTEMIS_PASSWORD}

# cloud s3 storage
s3.accessKeyId=${S3_ACCESS_KEY}
s3.secretKeyId=${S3_SECRET_KEY}
s3.namespace=${S3_NAMESPACE}
s3.region=${S3_REGION}
s3.bucket=${S3_BUCKET}
s3.par_prefix=https://fr6v1cmrytqp.objectstorage.eu-frankfurt-1.oci.customer-oci.com/p/GcRkjYcC9Obf1BqXayCMjRhub0solh4zkLAzCMWprlO_MhaBZqg8I4RRVIDVzDNz

# holarse
holarse.web.version=@git_commit@
holarse.search.rankLimit=0.07
holarse.roles.hierarchy=ROLE_ADMIN > ROLE_CORE > ROLE_MODERATOR > ROLE_USER