<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/base}">

<head>
</head>

<main layout:fragment="content" class="container-fluid w-75">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-4 border-end pe-5">
            <form th:action="@{/spielefinder}" th:object="${searchFormDetail}" method="GET">
            <input type="hidden" name="t" th:field="*{t}" />
            <input type="hidden" name="sort" th:field="*{sort}" />

            <h4 class="text-uppercase border-bottom">Suchbegriff</h4>
            <div class="mb-3">
                <input class="form-control rounded-0 u-form-control" type="search" placeholder="Nach Text filtern" name="q" th:field="*{q}">
                <button class="btn btn-primary" role="search">Suchen</button>
            </div>

            <h4 class="text-uppercase border-bottom">Tags</h4>

            <h4 class="text-uppercase border-bottom">Suchen in</h4>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{s}" value="articles">
                    <label class="form-check-label">Artikel</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{s}" value="news">
                    <label class="form-check-label">News</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{s}" value="threads">
                    <label class="form-check-label">Forum</label>
                </div>
            </form>
        </div>
        <!-- End Sidebar -->

        <!-- Search Results -->
        <div class="col-8 ps-5">
            <div class="container text-center">
                <h2 class="h2 border-bottom">Suchergebnis</h2>
            </div>

            <!-- Search Info -->
            <div class="d-md-flex justify-content-between g-mb-30">
                <h3 class="h6 text-uppercase g-mb-10 g-mb--lg">
                    <span class="g-color-gray-dark-v1" data-th-text="${count}">0</span>
                    <span th:if="${count == 1}">Ergebnis</span>
                    <span th:if="${count != 1}">Ergebnisse</span>
                </h3>
            </div>
            <!-- End Search Info -->

        </div>
        <!-- End Search Results -->
    </div>
</main>
