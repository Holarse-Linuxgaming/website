<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/base}">

<head>
</head>

<main layout:fragment="content" class="container w-25">

    <div class="row">
        <div class="col">
            <form data-th-action="@{/login}" data-th-object="${loginForm}" method="POST">
                <div class="mb-4">
                    <label class="form-label" for="username">Benutzername</label>
                    <input class="form-control" placeholder="E-Mail-Adresse" th:field="*{username}">
                    <small th-if="${#fields.hasErrors('username')}" th:errorclass="error" th:errors="*{username}" />
                </div>

                <div class="mb-4">
                    <label class="form-label" for="password">Passwort</label>
                    <input class="form-control" type="password" placeholder="Passwort" th:field="*{password}">
                    <small th:if="${#fields.hasErrors('password')}" th:errorclass="error" th:errors="*{username}" />
                </div>

                <div class="md-4" th:if="${session.loginError}">
                    <div th:text="${session.loginError}" class="text-danger"></div>
                </div>

                <div class="mb-4">
                    <button class="btn btn-primary" type="submit">Login</button>
                </div>
            </form>

            <div class="row">
                <div class="col-6">
                    <a th:href="@{/password_lost}">Passwort vergessen?</a>
                </div>
                <div class="col-6">
                    <a th:href="@{/register}">Neues Benutzerkonto</a>
                </div>
            </div>
        </div>
    </div>

</main>
