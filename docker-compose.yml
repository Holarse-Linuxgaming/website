
name: holarse
services:
  front:
    image: caddy:2.11-alpine
    restart: no
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./development/caddy/conf:/etc/caddy
      - caddy_data:/data
    networks:
      - holarse-front
      - holarse-back
  db:
    image: postgres:18.3-trixie
    restart: no
    env_file:
      - development/db.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - website_my_pgdata:/var/lib/postgresql/18/docker
      - ./backup:/backup
    networks:
      - holarse-back

  pgadmin4:
    image: dpage/pgadmin4:latest
    restart: no
    env_file:
      - development/db.env
    volumes:
      - ./development/pgadmin4_servers.json:/pgadmin4/servers.json:ro
    networks:
      - holarse-front
      - holarse-back
    ports: 
      - "127.0.0.1:9090:9090"
    depends_on:
      - db

  queue:
      image: apache/artemis:2.52.0-alpine
      restart: no
      env_file:
        - development/queue.env
      ports:
        - "127.0.0.1:8161:8161"
        - "127.0.0.1:61616:61616"
      volumes:
        - amq_journal_data:/var/lib/artemis-instance
      networks:
        - holarse-back

  app:
    image: eclipse-temurin:25-alpine
    restart: no
    env_file:
      - development/oci.env
      - development/db.env
      - development/queue.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./app/target/holarseweb.jar:/opt/holarseweb.jar:ro
    networks:
      - holarse-back
    user: 1000:1000
    command: /bin/sh -c "java -jar /opt/holarseweb.jar"
  cache:
      image: redis:8.6-alpine
      restart: no
      ports:
        - "127.0.0.1:6379:6379"
      networks:
        - holarse-back
  mail:
    image: axllent/mailpit:v1.29
    restart: no
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - holarse-front
      - holarse-back
  mariadb:
    image: mariadb:10.3
    env_file:
      - development/db.env
    restart: no
    volumes:
      - drupal_data:/var/lib/mysql
      - ./import:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:13306:3306"

volumes:
  website_my_pgdata: 
  amq_journal_data:
  caddy_data:
  drupal_data:

networks:
  holarse-front:
  holarse-back:
